server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:lb_children;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  #
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    #
    defer-datasource-initialization: true #
    #
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
  #

jwt:
  secret: ${JWT_SECRET:placeholder-jwt-secret}
  expiration: ${JWT_EXPIRATION:86400000}   # 24小时


ai:
  api:
    url: ${AI_API_URL:https://api.deepseek.com/chat/completions}   # ← 替换为 DeepSeek 地址
    key: ${AI_API_KEY:placeholder-api-key}          # ← 替换为你的 DeepSeek API Key
  model: ${AI_MODEL:deepseek-chat}                                # ← 替换模型名（或 deepseek-reasoner）
  child:
    daily-limit: ${AI_CHILD_DAILY_LIMIT:15}                                   # 保持不变