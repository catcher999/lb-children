server:
  port: 8080

spring:
  config:
    # 引入本机敏感配置（不存在时不报错），优先级高于本文件
    import: optional:application-local.yaml
  datasource:
    url: jdbc:mysql://localhost:3306/lb_children?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: false
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# 文件上传
app:
  upload-dir: ${APP_UPLOAD_DIR:./uploads}          # 上传文件保存目录
  upload-base-url: ${APP_UPLOAD_BASE_URL:http://localhost:8080}   # 访问文件的基础地址

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

jwt:
  # HS256 密钥，需为合法 Base64 且解码后 >= 32 字节；正式环境在 application-local.yaml 中覆盖
  secret: ${JWT_SECRET:dGhpcyBpcyBhIHNlY3JldCBrZXkgdGhhdCBpcyBsb25nIGVub3VnaA==}
  expiration: ${JWT_EXPIRATION:86400000}   # 24小时

ai:
  api:
    url: ${AI_API_URL:https://api.deepseek.com/chat/completions}   # DeepSeek 地址
    key: ${AI_API_KEY:placeholder-api-key}                         # 在 application-local.yaml 中覆盖
  model: ${AI_MODEL:deepseek-chat}
  memory:
    enabled: ${AI_MEMORY_ENABLED:true}          # 阶段一：记忆近况注入开关（false 时回退固定 prompt）
    max-items: ${AI_MEMORY_MAX_ITEMS:5}          # 每类数据源最多取几条
    max-content-length: ${AI_MEMORY_MAX_CONTENT_LENGTH:60}  # 单条内容最大长度，防止 prompt 过长
    top-k: ${AI_MEMORY_TOP_K:5}                  # 阶段二：相关记忆注入条数上限
    decay-lambda: ${AI_MEMORY_DECAY_LAMBDA:0.05} # 阶段二：指数衰减系数（/天）
    token-budget: ${AI_MEMORY_TOKEN_BUDGET:500}  # 阶段二：相关记忆段落 token 预算
  child:
    daily-limit: ${AI_CHILD_DAILY_LIMIT:15}
  rag:
    enabled: ${AI_RAG_ENABLED:true}          # 阶段四：RAG 权威文献检索开关（false 时跳过注入）
    top-k: ${AI_RAG_TOP_K:3}                 # 注入文献条数上限
